name: Auto PR dev → main

# Whenever dev gets new commits, open (or reuse) a PR that promotes dev to the
# stable main channel — so you never have to create that PR by hand. An existing
# open PR already tracks dev automatically, so this only creates one when none is
# open and dev is actually ahead of main.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-dev-to-main-pr
  cancel-in-progress: true

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open or reuse dev → main PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: >-
            Auto-opened: dev has commits to promote to the stable main channel.
            Merge this to update main, then push a v* tag on main to build and
            publish the .exe / .dmg to a Release. (Merging here does NOT itself
            trigger a release — only a v* tag does.)
        run: |
          set -euo pipefail
          ahead="$(git rev-list --count origin/main..origin/dev)"
          if [ "$ahead" -eq 0 ]; then
            echo "dev is not ahead of main — nothing to promote."
            exit 0
          fi
          echo "dev is $ahead commit(s) ahead of main."

          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base main --head dev --state open --json number -q '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open and tracks dev automatically — nothing to do."
            exit 0
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head dev \
            --title "Promote dev → main" \
            --body "$PR_BODY"
