name: Release

# release-please pattern: on every push to main it maintains a "Release PR"
# (chore(release): X.Y.Z) computed from the Conventional Commit history. Merging
# that PR creates the git tag + GitHub Release, which then triggers the installer
# build to attach the .exe / .dmg. So: feat:/fix: commits land on main → bot keeps
# the Release PR up to date → merge it to cut a release. No manual tagging.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # When the Release PR is merged, release-please creates the release; build the
  # installers and attach them to it. Releases created with GITHUB_TOKEN do not
  # re-trigger workflows, so we invoke the build here instead of on a tag push.
  build-installers:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-installers.yml
    with:
      version: ${{ needs.release-please.outputs.tag_name }}
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
