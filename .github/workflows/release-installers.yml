name: Build installers

# Reusable build workflow.
#   - Called by release.yml (release-please) when a release is cut: builds the
#     .exe/.dmg and uploads them to the freshly-created GitHub Release.
#   - Run manually (workflow_dispatch) to build artifacts for testing without
#     publishing anything.
on:
  workflow_call:
    inputs:
      version:
        description: "Version string for the artifacts (a leading 'v' is stripped)."
        required: true
        type: string
      release_tag:
        description: "If set, upload the built installers to this existing release tag."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for a test build."
        required: false
        type: string
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON (manifest)
        run: python3 -c "import json,sys; json.load(open('installer/manifest.json')); print('manifest.json OK')"
      - name: ShellCheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck --severity=error \
                     installer/common/install-nvim-env.sh \
                     installer/wsl/install.sh \
                     installer/macos/bootstrap.sh \
                     installer/macos/build.sh \
                     installer/macos/scripts/core/postinstall
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path installer/windows/bootstrap.ps1 -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) error(s)." }

  build-windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="${{ inputs.version }}"; v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build setup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem dist
      - name: Upload to release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload artifact
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  build-macos:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          v="${{ inputs.version }}"; v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build .dmg
        run: bash installer/macos/build.sh --version "${{ steps.ver.outputs.version }}" --out dist
      - name: Upload to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload artifact
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg
