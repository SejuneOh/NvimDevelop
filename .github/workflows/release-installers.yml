name: Build installers

# Push a tag like v1.0.0 to build + publish the .exe and .dmg to a Release.
# Use the "Run workflow" button (workflow_dispatch) to build artifacts without
# publishing — handy for testing the build on real Windows/macOS runners.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON (manifest)
        run: python3 -c "import json,sys; json.load(open('installer/manifest.json')); print('manifest.json OK')"
      - name: ShellCheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck --severity=error \
                     installer/common/install-nvim-env.sh \
                     installer/wsl/install.sh \
                     installer/macos/bootstrap.sh \
                     installer/macos/build.sh \
                     installer/macos/scripts/core/postinstall
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path installer/windows/bootstrap.ps1 -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) error(s)." }

  build-windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build setup.exe
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  build-macos:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build .dmg
        run: bash installer/macos/build.sh --version "${{ steps.ver.outputs.version }}" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/windows-installer/*.exe \
            artifacts/macos-installer/*.dmg
