[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
opacity = 0.95
blur = true
decorations = "Full"
startup_mode = "Windowed"
dynamic_title = true

[window.dimensions]
columns = 140
lines = 40

[window.padding]
x = 10
y = 10

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[terminal.shell]
program = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~"]

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# Carbonfox theme
[colors.primary]
background = "#161616"
foreground = "#f2f4f8"

[colors.cursor]
text = "#161616"
cursor = "#f2f4f8"

[colors.normal]
black   = "#282828"
red     = "#ee5396"
green   = "#25be6a"
yellow  = "#08bdba"
blue    = "#78a9ff"
magenta = "#be95ff"
cyan    = "#33b1ff"
white   = "#dde1e6"

[colors.bright]
black   = "#484848"
red     = "#f16da6"
green   = "#46c880"
yellow  = "#2dc7c4"
blue    = "#8cb6ff"
magenta = "#c8a5ff"
cyan    = "#52bdff"
white   = "#f2f4f8"

[colors.selection]
text = "#f2f4f8"
background = "#2a4a6d"

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "PasteSelection"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
