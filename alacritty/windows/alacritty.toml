[general]
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
opacity = 1.0
blur = false
decorations = "Full"
startup_mode = "Windowed"
dynamic_title = true

[window.dimensions]
columns = 140
lines = 40

[window.padding]
x = 10
y = 10

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.0

[font.normal]
family = "D2CodingLigature Nerd Font"
style = "Regular"

[font.bold]
family = "D2CodingLigature Nerd Font"
style = "Bold"

[font.italic]
family = "D2CodingLigature Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[terminal.shell]
program = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~"]

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# OneDark Warm theme (navarasu/onedark.nvim, background: bg_d)
[colors.primary]
background = "#242628"
foreground = "#b1b4b9"

[colors.cursor]
text = "#242628"
cursor = "#b1b4b9"

[colors.normal]
black   = "#191a1c"
red     = "#e16d77"
green   = "#99bc80"
yellow  = "#dfbe81"
blue    = "#68aee8"
magenta = "#c27fd7"
cyan    = "#5fafb9"
white   = "#b1b4b9"

[colors.bright]
black   = "#646568"
red     = "#e16d77"
green   = "#99bc80"
yellow  = "#dfbe81"
blue    = "#68aee8"
magenta = "#c27fd7"
cyan    = "#5fafb9"
white   = "#b1b4b9"

[colors.selection]
text = "CellForeground"
background = "#3e4045"

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "PasteSelection"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
